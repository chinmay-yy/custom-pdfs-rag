[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chinmay saini", email = "134822774+chinmay-yy@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.5.20",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.3.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-text-splitters>=0.3.0",
    "pymupdf>=1.6.0",
    "pypdf>=5.1.0",
    "pysqlite3-binary>=0.5.4; sys_platform == 'linux'",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.3.0",
    "streamlit>=1.62.0",
    "tiktoken>=0.8.0",
    "unstructured>=0.16.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
